<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>

    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/data.js"></script>
    <script defer src="./js/app.js"></script>
  </head>

  <body>
    <header>
      <h1>Snake</h1>
    </header>

    <main>
      <section id="start-screen" class="start-screen">
        <h2>Welcome to Snake!</h2>
        <p>Enter your name to start the game.</p>

        <label for="player-name">Player name</label>
        <input
          id="player-name"
          type="text"
          maxlength="20"
          autocomplete="given-name"
        />

        <p id="start-error" aria-live="polite"></p>
        <button id="start-button">Start Game</button>
      </section>

      <div id="game-screen" hidden>
        <section class="game-info">
          <p id="player-greeting" aria-live="polite"></p>
          <p>Score: <span id="score">0</span></p>
          <p>Best score: <span id="best-score">0</span></p>
          <p id="message" aria-live="polite">
            Use the arrow keys to move the snake.
          </p>
        </section>

        <section id="game-board" aria-label="Snake game board"></section>

        <section class="game-controls">
          <button id="restart-button">Restart</button>
          <button id="theme-button">Dark Mode</button>
        </section>

        <audio
          id="eat-sound"
          src="./assets/the-sound-of-a-hissing-snake.mp3"
          preload="auto"
        ></audio>

        <p class="instructions">
          Use the arrow keys to move the snake. Eat the food and avoid the walls
          and your own body. Reach 10 points to win.
        </p>
      </div>
    </main>
  </body>
</html>
